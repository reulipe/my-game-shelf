name: CI

on:
  push:
    branches: [main, development, master]
  pull_request:
    branches: [main, development, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm run test:spec
